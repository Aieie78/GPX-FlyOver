<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2128"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3540"/>
      <stop offset="1" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4552"/>
      <stop offset="1" stop-color="#232830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sfondo arrotondato -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- bagliore quota -->
  <circle cx="256" cy="215" r="190" fill="url(#glow)"/>

  <!-- profilo montagne -->
  <polygon points="0,340 130,205 210,300 300,175 420,300 512,230 512,420 0,420" fill="url(#mtn1)"/>
  <polygon points="0,380 100,290 190,350 320,250 420,340 512,300 512,430 0,430" fill="url(#mtn2)"/>

  <!-- percorso a tornanti -->
  <path d="M 90 400 C 150 400 150 340 210 340 C 270 340 270 290 210 270 C 150 250 150 210 210 190 C 250 175 300 175 330 150"
        fill="none" stroke="#ffcc00" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 90 400 C 150 400 150 340 210 340 C 270 340 270 290 210 270 C 150 250 150 210 210 190 C 250 175 300 175 330 150"
        fill="none" stroke="#4a3d00" stroke-width="16" stroke-dasharray="2 26" stroke-linecap="round" opacity="0.0"/>

  <!-- linea di quota tratteggiata sfumata (coerente col tool) -->
  <line x1="330" y1="150" x2="330" y2="230" stroke="#00e5ff" stroke-width="6" stroke-dasharray="10 8" opacity="0.85"/>
  <circle cx="330" cy="232" r="8" fill="#ffffff" opacity="0.5"/>

  <!-- icona mezzo (elicottero stilizzato) in quota -->
  <circle cx="330" cy="150" r="34" fill="#00e5ff" stroke="#ffffff" stroke-width="5"/>
  <text x="330" y="163" font-size="36" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">🚁</text>

  <!-- puntino di partenza -->
  <circle cx="90" cy="400" r="10" fill="#ffcc00"/>
</svg>
